name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install 'yt-dlp[default]==2026.08.19'
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/*.mjs
      - run: python build.py && python dist/ytload.pyz --version
      - if: matrix.python == '3.14'
        run: python -m pip install -r requirements-hosted-r2.txt
      - if: matrix.python == '3.14'
        run: python -m unittest tests.smoke_hosted_r2_dependency -v
